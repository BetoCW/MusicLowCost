[package]
name = "youtube_in_rust_web"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "YoutubeInRustWeb"
path = "src/main.rs"

[dependencies]
discord-rich-presence = "1.1.0"
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
log = "0.4.34"
md-5 = "0.11.0"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
souvlaki = "0.8.3"
strsim = "0.11.1"
tauri-winrt-notification = "0.8.1"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tray-icon = "0.25.1"
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
# Solo para la ventana de inicio de sesion (proceso aparte que se cierra al terminar).
wry = { version = "0.57", default-features = false }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.31"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# librespot-core con un cambio: una cuenta Free ya no termina el proceso (exit(1)),
# la app lo detecta y avisa. Ver vendor/librespot-core/src/session.rs.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
